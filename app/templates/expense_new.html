{% extends "base.html" %}
{% block title %}하청/외주 발주 등록{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="/expenses" class="text-sm text-slate-500">← 하청/외주 지급 목록</a>
  <h1 class="text-2xl font-bold text-slate-800 mt-2">🏗️ 하청/외주 발주 등록</h1>
  <p class="text-sm text-slate-500 mt-1">거래처에 발주한 작업과 지급 예정 금액을 등록합니다.</p>
</div>

<form method="post" action="/expenses/new" enctype="multipart/form-data" class="card space-y-4" style="max-width: 720px;">

  {% if return_to %}
  <input type="hidden" name="return_to" value="{{ return_to }}">
  {% endif %}

  <!-- 1. 프로젝트 -->
  <div>
    <label class="label" style="font-weight:700;">
      1. 프로젝트 <span style="color:#DC2626;">*</span>
      <span style="color: var(--ink-4); font-size: 11px; font-weight: 500;">(프로젝트명·코드·거래처명으로 검색)</span>
    </label>
    <div data-project-search data-name="project_id" data-required="1"
         data-initial-id="{{ preselect_project.id if preselect_project else '' }}"
         data-initial-name="{{ preselect_project.name if preselect_project else '' }}"></div>
  </div>

  <!-- 2. 거래처 (하청업체) -->
  <div>
    <label class="label" style="font-weight:700;">
      2. 거래처 (하청업체) <span style="color:#DC2626;">*</span>
      <span style="color: var(--ink-4); font-size: 11px; font-weight: 500;">(이름·사업자번호로 검색 · 없으면 즉시 등록)</span>
    </label>
    <div data-vendor-search data-name="vendor_id"></div>
  </div>

  <!-- 3. 역할 -->
  <div>
    <label class="label" style="font-weight:700;">3. 하청 역할</label>
    <select name="category" class="input" style="font-size:16px;">
      {% for role in roles %}
      <option value="{{ role }}" {% if role == '기타' %}selected{% endif %}>{{ role }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- 4. 발주일 -->
  <div>
    <label class="label" style="font-weight:700;">4. 발주일 / 작업일</label>
    <input type="date" name="expense_date" class="input" value="{{ today }}" style="font-size:16px;">
  </div>

  <!-- 5. 작업 내용 -->
  <div>
    <label class="label" style="font-weight:700;">5. 작업 내용 <span style="color:#DC2626;">*</span></label>
    <input type="text" name="description" class="input" required
           placeholder="예: 라인어레이 8통 + 오퍼레이터 1명" style="font-size:16px;">
  </div>

  <!-- 6. 상세 사양 -->
  <div>
    <label class="label" style="font-weight:700;">
      6. 상세 사양 <span class="text-xs text-slate-500">(장비 리스트, 인원, 일정 등)</span>
    </label>
    <textarea name="spec_detail" class="input" rows="4" style="font-size:15px;"
      placeholder="예:
- 스피커: L-Acoustics K2 8통 (L/R 4통씩)
- 콘솔: DiGiCo SD10
- 인원: 오퍼레이터 1명 + 스태프 2명
- 일정: 8/15 08:00 입장 ~ 22:00 철수"></textarea>
  </div>

  <!-- 7. 금액 + 부가세 -->
  <div style="background:#FFFBEB; padding:14px; border-radius:10px; border:1.5px solid #FCD34D;">
    <div style="font-size:14px; font-weight:800; color:#92400E; margin-bottom:10px;">
      💰 지급 금액
    </div>

    <div>
      <label class="label" style="font-weight:700;">부가세 처리 방식</label>
      <select name="vat_mode" id="vat-mode" class="input" style="font-size:16px;">
        <option value="supply" selected>공급가 입력 (부가세 10% 별도 추가)</option>
        <option value="total">총액 입력 (부가세 포함 금액)</option>
        <option value="none">부가세 없음 (현금거래·간이과세)</option>
      </select>
    </div>

    <div style="margin-top:10px;">
      <label class="label" style="font-weight:700;">
        금액 (원) <span style="color:#DC2626;">*</span>
        <span class="text-xs" id="amount-hint" style="color:#92400E; font-weight:400;">— 부가세 제외 공급가액</span>
      </label>
      <input type="text" name="amount" id="amount-input" class="input" required
             inputmode="numeric" placeholder="0"
             style="font-size:20px; font-weight:800; text-align:right;">
    </div>

    <!-- 부가세 계산 결과 -->
    <div id="vat-result" style="margin-top:12px; padding:12px; background:white;
         border-radius:8px; border:1px solid #FDE68A;">
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
        <span style="color:#78716C;">공급가액</span>
        <span class="num" id="disp-supply" style="font-weight:700;">0원</span>
      </div>
      <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;">
        <span style="color:#78716C;">부가세 (10%)</span>
        <span class="num" id="disp-vat" style="font-weight:700;">0원</span>
      </div>
      <div style="display:flex; justify-content:space-between; padding-top:8px;
           border-top:1.5px solid #FDE68A;">
        <span style="font-size:14px; font-weight:800;">실제 지급 총액</span>
        <span class="num" id="disp-total" style="font-size:19px; font-weight:900; color:#B45309;">0원</span>
      </div>
    </div>
  </div>

  <!-- 8. 지급 관리 -->
  <div style="background:#F0FDF4; padding:14px; border-radius:10px; border:1.5px solid #86EFAC;">
    <div style="font-size:14px; font-weight:800; color:#166534; margin-bottom:10px;">
      💵 지급 관리
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr; gap:12px;">
      <div>
        <label class="label" style="font-weight:700;">지급 상태</label>
        <select name="pay_status" class="input" style="font-size:16px;">
          <option value="미지급" selected>💸 미지급 (지급 대기)</option>
          <option value="지급완료">✓ 지급완료</option>
        </select>
      </div>
      <div>
        <label class="label" style="font-weight:700;">지급 예정일</label>
        <input type="date" name="pay_due_date" class="input" style="font-size:16px;">
      </div>
    </div>
    <div class="mt-3">
      <label class="label" style="font-weight:700;">지급 메모</label>
      <input type="text" name="pay_memo" class="input" style="font-size:16px;"
             placeholder="예: 세금계산서 수령 후 계좌이체">
    </div>
  </div>

  <!-- 9. 결제 수단 -->
  <div>
    <label class="label" style="font-weight:700;">8. 결제 수단</label>
    <select name="payment_method" class="input" style="font-size:16px;">
      <option value="계좌이체" selected>계좌이체</option>
      <option value="현금">현금</option>
      <option value="카드">카드</option>
      <option value="어음">어음</option>
    </select>
  </div>

  <!-- 10. 세금계산서 -->
  <div>
    <label class="label" style="font-weight:700;">9. 세금계산서</label>
    <select name="has_tax_invoice" class="input" style="font-size:16px;">
      <option value="no" selected>미발행 / 대기</option>
      <option value="yes">📄 발행 완료</option>
    </select>
  </div>

  <!-- 11. 첨부 -->
  <div>
    <label class="label" style="font-weight:700;">10. 계약서·계산서 사진 (선택)</label>
    <input type="file" name="receipt" accept="image/*" capture="environment" class="input">
  </div>

  <!-- 저장 -->
  <div style="padding-top:8px;">
    <button type="submit" class="btn-primary" style="width:100%; padding:16px; font-size:17px; font-weight:800;">
      💾 발주 등록
    </button>
  </div>
</form>

<div style="max-width:720px; margin-top:12px; text-align:center;">
  <a href="{{ return_to or '/expenses' }}" class="text-sm text-slate-500">← 취소하고 돌아가기</a>
</div>

<script>
/* 금액 콤마 + 부가세 자동 계산 (JS 실패해도 폼 제출은 정상 동작) */
(function () {
  try {
    var input = document.getElementById('amount-input');
    var modeSel = document.getElementById('vat-mode');
    var hint = document.getElementById('amount-hint');
    var dS = document.getElementById('disp-supply');
    var dV = document.getElementById('disp-vat');
    var dT = document.getElementById('disp-total');
    if (!input || !modeSel) return;

    function raw(v) { return String(v || '').replace(/[^0-9]/g, ''); }
    function fmt(n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; }

    function calc() {
      var n = parseInt(raw(input.value), 10) || 0;
      var mode = modeSel.value;
      var supply, vat, total;
      if (mode === 'total') {
        total = n;
        supply = Math.round(n / 1.1);
        vat = n - supply;
        if (hint) hint.textContent = '— 부가세가 포함된 총액';
      } else if (mode === 'none') {
        supply = n; vat = 0; total = n;
        if (hint) hint.textContent = '— 부가세 없음';
      } else {
        supply = n; vat = Math.round(n * 0.1); total = n + vat;
        if (hint) hint.textContent = '— 부가세 제외 공급가액';
      }
      if (dS) dS.textContent = fmt(supply);
      if (dV) dV.textContent = fmt(vat) + (mode === 'none' ? ' (없음)' : '');
      if (dT) dT.textContent = fmt(total);
    }

    /* 입력 중 콤마 삽입 (커서 위치 보정) */
    input.addEventListener('input', function () {
      var digits = raw(input.value);
      input.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      calc();
    });
    modeSel.addEventListener('change', calc);
    calc();
  } catch (err) { console.error('amount', err); }
})();

</script>

{% endblock %}
