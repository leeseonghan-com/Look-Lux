{% extends "base.html" %}
{% block title %}비용 등록 (간편){% endblock %}
{% block content %}

<div class="mb-4">
  <a href="/expenses" class="text-sm text-slate-500">← 비용처리 목록</a>
  <h1 class="text-2xl font-bold text-slate-800 mt-2">💰 비용 등록 (간편 버전)</h1>
  <p class="text-sm text-slate-500 mt-1">
    저장 버튼 문제 해결용 안정 버전 · 필요한 최소 항목만 표시합니다.
  </p>
</div>

<form method="post" action="/expenses/new" enctype="multipart/form-data" class="card space-y-4" style="max-width: 640px;">

  {% if return_to %}
  <input type="hidden" name="return_to" value="{{ return_to }}">
  {% endif %}

  <!-- 1. 프로젝트 (필수) -->
  <div>
    <label class="label" style="font-weight: 700;">1. 프로젝트 <span style="color:#DC2626;">*</span></label>
    <select name="project_id" class="input" required style="font-size: 16px;">
      <option value="">— 프로젝트를 선택하세요 —</option>
      {% for p in projects %}
      <option value="{{ p.id }}" {% if preselect_project and preselect_project.id == p.id %}selected{% endif %}>
        {{ p.name }}{% if p.vendor_name %} · {{ p.vendor_name }}{% endif %}{% if p.event_date %} · {{ p.event_date }}{% endif %}
      </option>
      {% endfor %}
    </select>
  </div>

  <!-- 2. 날짜 (필수) -->
  <div>
    <label class="label" style="font-weight: 700;">2. 날짜 <span style="color:#DC2626;">*</span></label>
    <input type="date" name="expense_date" class="input" value="{{ today }}" required style="font-size: 16px;">
  </div>

  <!-- 3. 항목 -->
  <div>
    <label class="label" style="font-weight: 700;">3. 항목</label>
    <select name="category" class="input" style="font-size: 16px;">
      <option value="재료비">재료비</option>
      <option value="식비">식비</option>
      <option value="교통비">교통비</option>
      <option value="장비대여">장비대여</option>
      <option value="숙박비">숙박비</option>
      <option value="기타" selected>기타</option>
    </select>
  </div>

  <!-- 4. 내용 (필수) -->
  <div>
    <label class="label" style="font-weight: 700;">4. 내용 <span style="color:#DC2626;">*</span></label>
    <input type="text" name="description" class="input" required
           placeholder="예: 무대 현수막 제작" style="font-size: 16px;">
  </div>

  <!-- 5. 금액 (필수) -->
  <div>
    <label class="label" style="font-weight: 700;">5. 금액 (원) <span style="color:#DC2626;">*</span></label>
    <input type="number" name="amount" class="input" required min="0" step="1"
           placeholder="0" style="font-size: 16px;">
  </div>

  <!-- 6. 결제 수단 -->
  <div>
    <label class="label" style="font-weight: 700;">6. 결제 수단</label>
    <select name="payment_method" class="input" style="font-size: 16px;">
      <option value="현금">현금</option>
      <option value="카드">카드</option>
      <option value="계좌이체">계좌이체</option>
    </select>
  </div>

  <!-- 7. 거래처 (선택) -->
  <div>
    <label class="label" style="font-weight: 700;">7. 거래처 (선택)</label>
    <select name="vendor_id" class="input" style="font-size: 16px;">
      <option value="">— 거래처 없음 —</option>
      {% for v in vendors %}
      <option value="{{ v.id }}">{{ v.name }}</option>
      {% endfor %}
    </select>
  </div>

  <!-- 8. 지급 상태 (거래처 지정 시만 의미) -->
  <div style="background:#F0FDF4; padding:12px; border-radius:8px; border:1px solid #86EFAC;">
    <label class="label" style="font-weight: 700; color:#166534;">
      8. 지급 상태 <span style="font-weight:400; color:#4B5563; font-size:11px;">(거래처 있을 때만 의미)</span>
    </label>
    <select name="pay_status" class="input" style="font-size: 16px;">
      <option value="지급완료" selected>✓ 지급완료</option>
      <option value="미지급">💸 미지급 (하청·외주 대기)</option>
    </select>
  </div>

  <!-- 9. 증빙 -->
  <div>
    <label class="label" style="font-weight: 700;">9. 증빙 여부</label>
    <select name="has_evidence" class="input" style="font-size: 16px;">
      <option value="yes" selected>✓ 증빙 있음</option>
      <option value="no">⚠ 증빙 없음 (현금거래)</option>
    </select>
  </div>

  <!-- 10. 영수증 사진 (선택) -->
  <div>
    <label class="label" style="font-weight: 700;">10. 영수증 사진 (선택)</label>
    <input type="file" name="receipt" accept="image/*" capture="environment" class="input">
  </div>

  <!-- 저장 버튼 (100% 표준 HTML) -->
  <div style="padding-top: 8px;">
    <button type="submit" class="btn-primary" style="width:100%; padding:16px; font-size:17px; font-weight:800;">
      💾 저장
    </button>
  </div>
</form>

<!-- 취소 링크는 폼 밖에 -->
<div style="max-width:640px; margin-top:12px; text-align:center;">
  <a href="{{ return_to or '/expenses' }}" class="text-sm text-slate-500">← 취소하고 돌아가기</a>
</div>

<!-- 안내 문구 -->
<div style="max-width:640px; margin-top:20px; padding:12px; background:#FEF3C7; border-radius:8px; font-size:12px; color:#78350F;">
  💡 <b>이 화면이 안정 버전입니다.</b> 저장이 안 되는 문제가 있으시면 이 화면을 사용해주세요.
  기존 화면(<a href="/expenses/new?adv=1" style="color:#B45309; text-decoration:underline;">고급 등록</a>)도 계속 사용 가능합니다.
</div>

{% endblock %}
